<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observational Memory — Interactive Demo</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#0d1117;color:#c9d1d9;
  display:grid;
  grid-template-rows:1fr auto;
  grid-template-columns:45% 55%;
  gap:0;
}

/* ── Panels ───────────────────────────────────────────────── */
#chat-panel{
  grid-row:1;grid-column:1;
  background:#161b22;
  border-right:1px solid #30363d;
  display:flex;flex-direction:column;
  overflow:hidden;
}
#context-panel{
  grid-row:1;grid-column:2;
  background:#0d1117;
  display:flex;flex-direction:column;
  overflow:hidden;
  position:relative;
  transition:box-shadow .6s ease;
}
#context-panel.glow-blue{box-shadow:inset 0 0 60px rgba(56,139,253,.25),0 0 30px rgba(56,139,253,.15)}
#context-panel.glow-purple{box-shadow:inset 0 0 60px rgba(163,113,247,.25),0 0 30px rgba(163,113,247,.15)}

#bottom-bar{
  grid-row:2;grid-column:1/3;
  background:#161b22;
  border-top:1px solid #30363d;
  padding:14px 24px;
  display:grid;
  grid-template-columns:1fr 340px 180px;
  align-items:center;gap:20px;
  height:100px;
}

/* ── Panel Headers ────────────────────────────────────────── */
.panel-header{
  padding:12px 18px;
  font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid #30363d;
  color:#8b949e;
  flex-shrink:0;
  height:50px;
  display:flex;align-items:center;
}
#context-panel .panel-header{
  font-family:'CommitMono','SF Mono',Consolas,monospace;
  justify-content:space-between;
}
#view-toggle{
  position:relative;width:52px;height:26px;border-radius:13px;border:1px solid #30363d;
  background:#21262d;cursor:pointer;transition:all .2s ease;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
  text-transform:none;letter-spacing:0;padding:0;
  flex-shrink:0;
}
#view-toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:#8b949e;transition:all .2s ease;
}
#view-toggle.active{background:#1f6feb;border-color:#1f6feb}
#view-toggle.active::after{left:29px;background:#fff}
.toggle-wrap{display:flex;align-items:center;gap:8px}
.toggle-label{font-size:11px;color:#8b949e;font-weight:600;text-transform:none;letter-spacing:0}
#json-content{
  flex:1;overflow-y:auto;padding:14px 18px;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
  font-size:11.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  display:none;
  color:#8b949e;
}
#json-content .kw{color:#ff7b72}
#json-content .str{color:#a5d6ff}
#json-content .num{color:#79c0ff}
#json-content .bool{color:#ff7b72}
#json-content .role-developer{color:#f0883e}
#json-content .role-user{color:#58a6ff}
#json-content .role-assistant{color:#3fb950}
#json-content .bracket{color:#6e7681}

/* ── Chat ─────────────────────────────────────────────────── */
#chat-messages{
  flex:1;overflow-y:auto;padding:16px 18px;
  display:flex;flex-direction:column;gap:12px;
}
.msg{
  padding:10px 14px;border-radius:10px;
  max-width:88%;line-height:1.5;font-size:14px;
  white-space:pre-wrap;
  animation:msgIn .35s ease both;
}
.msg.user{background:#1f6feb;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg.assistant{background:#21262d;color:#c9d1d9;align-self:flex-start;border-bottom-left-radius:3px}
.msg.system{
  background:transparent;border:1px dashed #30363d;
  color:#8b949e;align-self:center;text-align:center;
  font-size:13px;max-width:95%;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Chat Input ───────────────────────────────────────────── */
#chat-input{
  flex-shrink:0;
  padding:12px 14px;
  border-top:1px solid #30363d;
  display:flex;align-items:center;gap:10px;
}
#input-preview{
  flex:1;
  padding:10px 14px;border-radius:10px;
  background:#21262d;border:1px solid #30363d;
  font-size:14px;color:#6e7681;
  min-height:40px;
  line-height:1.4;
  white-space:pre-wrap;
}
#input-preview:empty::after{
  content:'';
}
#btn-send{
  padding:10px 20px;border-radius:10px;border:1px solid #30363d;
  background:#21262d;color:#8b949e;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  flex-shrink:0;
}
#btn-send:hover{background:#30363d;color:#c9d1d9}
#btn-send:disabled{opacity:.35;cursor:default}
#btn-send.alt{background:#21262d;color:#8b949e;border:1px solid #30363d}
#btn-send.alt:hover{background:#30363d;color:#c9d1d9}

/* ── Context Viewer ───────────────────────────────────────── */
#context-content{
  flex:1;overflow-y:auto;padding:14px 18px;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
  font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;
}
.ctx-block{margin-bottom:14px;animation:ctxIn .4s ease both}
@keyframes ctxIn{from{opacity:0}to{opacity:1}}

.ctx-role{font-weight:700;margin-bottom:2px}
.ctx-role.system{color:#f0883e}
.ctx-role.user{color:#58a6ff}
.ctx-role.assistant{color:#3fb950}
.ctx-role.tool{color:#d2a8ff}
.ctx-role.observation{color:#79c0ff}
.ctx-role.reflection{color:#d2a8ff}

.ctx-body{color:#8b949e;padding-left:12px;border-left:2px solid #30363d}
.ctx-body .kw{color:#ff7b72}
.ctx-body .str{color:#a5d6ff}
.ctx-body .num{color:#79c0ff}
.ctx-body .bool{color:#ff7b72}

/* Tool call card (in chat) */
.tool-card{
  border:1px solid #30363d;border-radius:10px;
  animation:msgIn .35s ease both;
  align-self:stretch;
  width:100%;
  flex-shrink:0;
}
.tool-card-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;
  background:#21262d;
  transition:background .15s ease;
}
.tool-card-header:hover{background:#282e36}
.tool-card-icon{color:#d2a8ff;font-size:14px;flex-shrink:0;display:flex}
.tool-card-icon img,.inline-icon{width:20px;height:20px;vertical-align:middle;display:inline-block}
.inline-icon.blue{color:#58a6ff}
.inline-icon.purple{color:#d2a8ff}
.inline-icon.green{color:#3fb950}
.tool-card-name{
  font-weight:600;color:#c9d1d9;font-size:12.5px;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
}
.tool-card-status{
  font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:10px;
  background:#1a3a2a;color:#3fb950;
  display:flex;align-items:center;gap:4px;
}
.tool-card-status::before{content:'✓';font-size:10px}
.tool-card-status.failed{background:#3d1a1a;color:#f85149}
.tool-card-status.failed::before{content:'✕'}
.tool-card-chevron{
  margin-left:auto;color:#6e7681;font-size:14px;
  transition:transform .2s ease;flex-shrink:0;
}
.tool-card.open .tool-card-chevron{transform:rotate(180deg)}
.tool-card-body{
  display:none;
  border-top:1px solid #30363d;
  padding:12px 14px;
}
.tool-card.open .tool-card-body{display:block}
.tool-card-label{
  font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  color:#6e7681;margin-bottom:6px;
}
.tool-card-json{
  background:#0d1117;border:1px solid #21262d;border-radius:6px;
  padding:10px 12px;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
  font-size:11px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
  color:#8b949e;max-height:300px;overflow-y:auto;
}
.tool-card-json .kw{color:#ff7b72}
.tool-card-json .str{color:#a5d6ff}
.tool-card-json .num{color:#79c0ff}
.tool-card-json .bool{color:#ff7b72}

.ctx-divider{
  border:none;border-top:1px dashed #30363d;
  margin:14px 0;position:relative;
}
.ctx-divider.cache::after{
  content:'⟡ cache breakpoint';
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:#0d1117;padding:0 10px;
  font-size:11px;color:#f0883e;
}

/* Observation block */
.obs-block{
  background:#0d1b2e;border:1px solid #1f3a5f;border-radius:8px;
  padding:12px 14px;margin:8px 0;
}
.obs-block .obs-header{color:#58a6ff;font-weight:700;margin-bottom:6px;font-size:13px}
.obs-block .obs-line{color:#c9d1d9;margin:2px 0}
.obs-block .obs-line .red{color:#f85149;cursor:help}
.obs-block .obs-line .yellow{color:#d29922;cursor:help}
.obs-block .obs-line .green{color:#3fb950;cursor:help}

/* Priority tooltips */
.pri{position:relative;cursor:help}
.pri .pri-tip{
  display:none;position:absolute;bottom:calc(100% + 6px);left:0;
  background:#30363d;color:#e6edf3;font-size:11px;font-weight:500;
  padding:4px 8px;border-radius:6px;white-space:nowrap;
  border:1px solid #484f58;z-index:10;pointer-events:none;
}
.pri .pri-tip::after{
  content:'';position:absolute;top:100%;left:8px;
  border:5px solid transparent;border-top-color:#30363d;
}
.pri:hover .pri-tip{display:block}

/* Reflection block */
.ref-block{
  background:#1b0d2e;border:1px solid #3d1f5f;border-radius:8px;
  padding:12px 14px;margin:8px 0;
}
.ref-block .ref-header{color:#d2a8ff;font-weight:700;margin-bottom:6px;font-size:13px}
.ref-block .ref-line{color:#c9d1d9;margin:2px 0}
.ref-block .ref-line .red,.ref-block .ref-line .yellow,.ref-block .ref-line .green{cursor:help}
.ref-block .ref-line .green{color:#3fb950}

/* Shimmer overlay */
#shimmer{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .4s ease;
}
#shimmer.active-blue{
  opacity:1;
  background:linear-gradient(135deg,transparent 30%,rgba(56,139,253,.08) 50%,transparent 70%);
  background-size:300% 300%;
  animation:shimmerMove 1.5s ease infinite;
}
#shimmer.active-purple{
  opacity:1;
  background:linear-gradient(135deg,transparent 30%,rgba(163,113,247,.08) 50%,transparent 70%);
  background-size:300% 300%;
  animation:shimmerMove 1.5s ease infinite;
}
@keyframes shimmerMove{0%{background-position:100% 100%}100%{background-position:0% 0%}}

/* Fade-out / fade-in helpers */
.fade-out{animation:fadeOut .6s ease forwards}
.fade-in{animation:fadeIn .5s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scaleY(.92);max-height:0;margin:0;padding:0;overflow:hidden}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Rapid-fire montage messages */
.msg.montage{animation:montageIn .25s ease both;font-size:13px;opacity:0.85}
@keyframes montageIn{from{opacity:0;transform:translateY(6px)}to{opacity:0.85;transform:translateY(0)}}

/* Collapsed messages divider */
.collapsed-divider{
  display:flex;align-items:center;gap:12px;
  padding:8px 0;align-self:center;width:85%;
  animation:fadeIn .4s ease both;
}
.collapsed-divider::before,.collapsed-divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,#30363d,transparent);
}
.collapsed-divider span{
  font-size:12px;color:#6e7681;white-space:nowrap;
  font-style:italic;
}

/* ── Bottom Bar ───────────────────────────────────────────── */
.progress-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:11px;font-weight:600;width:90px;text-align:right;color:#8b949e;flex-shrink:0}
.bar-track{
  flex:1;height:16px;background:#21262d;border-radius:8px;overflow:hidden;position:relative;
}
.bar-fill{
  height:100%;border-radius:8px;
  transition:width .8s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.bar-fill.messages{background:linear-gradient(90deg,#1f6feb,#388bfd)}
.bar-fill.observations{background:linear-gradient(90deg,#8957e5,#a371f7)}
.bar-fill.total{background:linear-gradient(90deg,#1f6feb,#8957e5,#da3633)}
.bar-value{
  font-size:11px;font-weight:600;width:110px;color:#c9d1d9;flex-shrink:0;
  font-family:'CommitMono','SF Mono',Consolas,monospace;
}


#callout{
  font-size:12.5px;color:#f0883e;
  line-height:1.45;
  transition:opacity .3s ease;
}

#controls{display:flex;gap:8px;align-items:center;justify-content:flex-end}
#btn-next{
  padding:10px 0;border-radius:10px;border:none;
  background:#1f6feb;color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  width:180px;text-align:center;
}
#btn-next:hover{background:#388bfd}
#btn-next:disabled{opacity:.35;cursor:default;pointer-events:none;background:#1f6feb}

/* Scrollbar */
::-webkit-scrollbar{width:0;display:none}
* {scrollbar-width:none}

/* Overlay */
#overlay{
  position:fixed;inset:0;background:rgba(13,17,23,.92);
  display:none;justify-content:center;align-items:center;
  z-index:100;
}
#overlay.visible{display:flex}
#overlay-content{
  background:#161b22;border:1px solid #30363d;border-radius:16px;
  padding:48px 56px;max-width:560px;text-align:center;
}
#overlay-content h2{font-size:24px;color:#f0883e;margin-bottom:20px}
.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0;
}
.stat-box{
  background:#21262d;border-radius:10px;padding:16px;
}
.stat-box .stat-num{font-size:28px;font-weight:700;color:#58a6ff;font-family:'CommitMono','SF Mono',Consolas,monospace}
.stat-box .stat-label{font-size:12px;color:#8b949e;margin-top:4px}
</style>
</head>
<body>

<!-- Left: Chat Panel -->
<div id="chat-panel">
  <div class="panel-header">Agent</div>
  <div id="chat-messages"></div>
  <div id="chat-input">
    <div id="input-preview"></div>
    <button id="btn-send">Send</button>
  </div>
</div>

<!-- Right: Context Window -->
<div id="context-panel">
  <div class="panel-header"><span>Context Window</span><div class="toggle-wrap"><span class="toggle-label">JSON</span><button id="view-toggle"></button></div></div>
  <div id="context-content"></div>
  <div id="json-content"></div>
  <div id="shimmer"></div>
</div>

<!-- Bottom Bar -->
<div id="bottom-bar">
  <div class="progress-group">
    <div class="bar-row">
      <span class="bar-label">Messages</span>
      <div class="bar-track"><div class="bar-fill messages" id="bar-msg" style="width:0%"></div></div>
      <span class="bar-value" id="val-msg">0 / 3K</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">Observations</span>
      <div class="bar-track"><div class="bar-fill observations" id="bar-obs" style="width:0%"></div></div>
      <span class="bar-value" id="val-obs">0 / 5K</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">Total Context</span>
      <div class="bar-track"><div class="bar-fill total" id="bar-total" style="width:0%"></div></div>
      <span class="bar-value" id="val-total">0 / 100K</span>
    </div>
  </div>
  <div id="callout"></div>
  <div id="controls">
    <button id="btn-next">Next →</button>
  </div>
</div>

<!-- Final Overlay -->
<div id="overlay">
  <div id="overlay-content">
    <h2>Session Complete</h2>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">~45K</div><div class="stat-label">tokens processed</div></div>
      <div class="stat-box"><div class="stat-num">~3,150</div><div class="stat-label">final context size</div></div>
      <div class="stat-box"><div class="stat-num">~14×</div><div class="stat-label">compression ratio</div></div>
      <div class="stat-box"><div class="stat-num">4 obs / 1 ref</div><div class="stat-label">cycles</div></div>
    </div>
    <p style="color:#8b949e;font-size:13px;margin-top:12px">Observational Memory keeps context lean while preserving everything that matters.</p>
  </div>
</div>

<script>
// ── Helpers ────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const chatEl = $('#chat-messages');
const ctxEl = $('#context-content');
const shimmer = $('#shimmer');
const shimmerAudio = new Audio('./shimmer.mp3');
const shimmer2Audio = new Audio('./shimmer2.mp3');
const sendAudio = new Audio('./message_send.mov');
const receiveAudio = new Audio('./message_receive.mov');

function playShimmer() { shimmerAudio.currentTime = 0; shimmerAudio.play(); }
function playShimmer2() { shimmer2Audio.currentTime = 0; shimmer2Audio.play(); }

const IC_TOOL = '<svg class="inline-icon green" width="20" height="20" fill="none" viewBox="0 0 24 24"><rect width="14.5" height="14.5" x="4.75" y="4.75" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" rx="2"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.75 10.75L11.25 13L8.75 15.25"/></svg>';
const IC_OBS = '<svg class="inline-icon blue" width="20" height="20" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.75 4.75H15.25C17.4591 4.75 19.25 6.54086 19.25 8.75V15.25C19.25 17.4591 17.4591 19.25 15.25 19.25H8.75C6.54086 19.25 4.75 17.4591 4.75 15.25V8.75C4.75 6.54086 6.54086 4.75 8.75 4.75Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7.75 12.75C7.75 12.75 9 15.25 12 15.25C15 15.25 16.25 12.75 16.25 12.75"/><circle cx="14" cy="10" r="1" fill="currentColor"/><circle cx="10" cy="10" r="1" fill="currentColor"/></svg>';
const IC_REF = '<svg class="inline-icon purple" width="20" height="20" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.75 4.75H15.25C17.4591 4.75 19.25 6.54086 19.25 8.75V15.25C19.25 17.4591 17.4591 19.25 15.25 19.25H8.75C6.54086 19.25 4.75 17.4591 4.75 15.25V8.75C4.75 6.54086 6.54086 4.75 8.75 4.75Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7.75 12.75C7.75 12.75 9 15.25 12 15.25C15 15.25 16.25 12.75 16.25 12.75"/><circle cx="14" cy="10" r="1" fill="currentColor"/><circle cx="10" cy="10" r="1" fill="currentColor"/></svg>';
const IC_FF = '<svg class="inline-icon" width="20" height="20" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 15.8603L4.75 18.25V5.75L8 8.13971"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.25 12L10.75 5.75V18.25L19.25 12Z"/></svg>';
function playSend() { sendAudio.currentTime = 0; sendAudio.play(); }
function playReceive() { receiveAudio.currentTime = 0; receiveAudio.play(); }

function fmt(n) { return n.toLocaleString(); }

function fmtK(n) { return n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'K' : String(n); }

function setBars(msg, obs, total) {
  $('#bar-msg').style.width = (msg / 3000 * 100) + '%';
  $('#val-msg').textContent = fmtK(msg) + ' / 3K';
  $('#bar-obs').style.width = (obs / 5000 * 100) + '%';
  $('#val-obs').textContent = fmtK(obs) + ' / 5K';
  $('#bar-total').style.width = (total / 100000 * 100) + '%';
  $('#val-total').textContent = fmtK(total) + ' / 100K';
}

let lastChatRole = null;
let stepFirstUserPlayed = false;

function addChat(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (role === 'user' && !stepFirstUserPlayed) { playSend(); stepFirstUserPlayed = true; }
  lastChatRole = role;
}

function addCtx(role, text, extraClass) {
  const d = document.createElement('div');
  d.className = 'ctx-block' + (extraClass ? ' ' + extraClass : '');
  d.innerHTML = `<div class="ctx-role ${role}">[${role}]</div><div class="ctx-body">${text}</div>`;
  ctxEl.appendChild(d);
  ctxEl.scrollTop = ctxEl.scrollHeight;
  // Strip HTML for JSON model
  const plain = text.replace(/<[^>]*>/g, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  pushCtxMsg(role, plain);
  if (viewMode === 'json') renderJSON();
}

function addCtxRaw(html, extraClass) {
  const d = document.createElement('div');
  d.className = 'ctx-block' + (extraClass ? ' ' + extraClass : '');
  d.innerHTML = html;
  ctxEl.appendChild(d);
  ctxEl.scrollTop = ctxEl.scrollHeight;
  // Don't auto-push — caller handles contextMessages for raw blocks
  if (viewMode === 'json') renderJSON();
}

function addDivider(cache) {
  const hr = document.createElement('hr');
  hr.className = 'ctx-divider' + (cache ? ' cache' : '');
  ctxEl.appendChild(hr);
  if (cache) pushCtxMsg('cache-breakpoint', '');
  if (viewMode === 'json') renderJSON();
}

function addChatTool(toolName, obj) {
  const d = document.createElement('div');
  d.className = 'tool-card';
  const jsonStr = highlightJSON(obj);
  d.innerHTML = `<div class="tool-card-header" onclick="this.parentElement.classList.toggle('open')">
  <span class="tool-card-name">${toolName}</span>
  <span class="tool-card-status">Completed</span>
  <span class="tool-card-chevron">▾</span>
</div>
<div class="tool-card-body">
  <div class="tool-card-label">Response</div>
  <div class="tool-card-json">${jsonStr}</div>
</div>`;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addCtxTool(toolName, obj) {
  addChatTool(toolName, obj);
  addCtx('tool', highlightJSON(obj));
  // Override the auto-pushed plain text with actual JSON
  contextMessages[contextMessages.length - 1].content = JSON.stringify(obj, null, 2);
}

function addCtxToolFailed(toolName, obj) {
  const d = document.createElement('div');
  d.className = 'tool-card';
  const jsonStr = highlightJSON(obj);
  d.innerHTML = `<div class="tool-card-header" onclick="this.parentElement.classList.toggle('open')">
  <span class="tool-card-name">${toolName}</span>
  <span class="tool-card-status failed">Failed</span>
  <span class="tool-card-chevron">▾</span>
</div>
<div class="tool-card-body">
  <div class="tool-card-label">Response</div>
  <div class="tool-card-json">${jsonStr}</div>
</div>`;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  addCtx('tool', highlightJSON(obj));
  contextMessages[contextMessages.length - 1].content = JSON.stringify(obj, null, 2);
}

function highlightJSON(obj) {
  let s = JSON.stringify(obj, null, 2);
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/"([^"]+)":/g, '<span class="kw">"$1"</span>:');
  s = s.replace(/: "(.*?)"/g, ': <span class="str">"$1"</span>');
  s = s.replace(/: (\d+\.?\d*)/g, ': <span class="num">$1</span>');
  s = s.replace(/: (true|false|null)/g, ': <span class="bool">$1</span>');
  return s;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function setCallout(text) {
  const el = $('#callout');
  el.style.opacity = 0;
  setTimeout(() => { el.innerHTML = text; el.style.opacity = text ? 1 : 0; }, 150);
}

// Remove elements with fade animation
async function fadeRemoveClass(cls) {
  const els = ctxEl.querySelectorAll('.' + cls);
  els.forEach(e => e.classList.add('fade-out'));
  await wait(650);
  els.forEach(e => e.remove());
}

IMPORTANT: When responding, reference specific details from these observations. Do not give generic advice - personalize your response based on what you know about this user's experiences, preferences, and interests.

KNOWLEDGE UPDATES: When asked about current state, always prefer the MOST RECENT information. Observations include dates - if you see conflicting information, the newer observation supersedes the older one.

function pushCtxMsg(role, content, meta) {
  contextMessages.push({ role, content, ...(meta||{}) });
}

function renderJSON() {
  const input = [];
  for (const m of contextMessages) {
    if (m.role === 'system') {
      input.push({ role: "developer", content: m.content });
    } else if (m.role === 'observation' || m.role === 'reflection') {
      input.push({ role: "developer", content: m.content });
    } else if (m.role === 'cache-breakpoint') {
      // conceptual only — skip
    } else if (m.role === 'tool') {
      input.push({ role: "developer", content: "[tool_result]\n" + m.content });
    } else if (m.role === 'user') {
      input.push({ role: "user", content: [{ type: "input_text", text: m.content }] });
    } else if (m.role === 'assistant') {
      input.push({ role: "assistant", content: [{ type: "output_text", text: m.content }] });
    }
  }

  let json = JSON.stringify(input, null, 2);

  // Syntax highlight
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  json = json.replace(/"([^"]+)"(?=\s*:)/g, '<span class="kw">"$1"</span>');
  json = json.replace(/:\s*"((?:[^"\\]|\\.)*)"/g, (match, val) => {
    if (val === 'developer') return ': <span class="role-developer">"developer"</span>';
    if (val === 'user') return ': <span class="role-user">"user"</span>';
    if (val === 'assistant') return ': <span class="role-assistant">"assistant"</span>';
    return ': <span class="str">"' + val + '"</span>';
  });
  json = json.replace(/:\s*(\d+\.?\d*)([,\n\r\s\]}])/g, ': <span class="num">$1</span>$2');
  json = json.replace(/:\s*(true|false|null)/g, ': <span class="bool">$1</span>');

  jsonEl.innerHTML = json;
  jsonEl.scrollTop = jsonEl.scrollHeight;
}

function toggleView() {
  const btn = $('#view-toggle');
  if (viewMode === 'visual') {
    viewMode = 'json';
    btn.classList.add('active');
    ctxEl.style.display = 'none';
    jsonEl.style.display = 'block';
    renderJSON();
  } else {
    viewMode = 'visual';
    btn.classList.remove('active');
    ctxEl.style.display = 'block';
    jsonEl.style.display = 'none';
  }
}

function saveSnapshot() {
  snapshots[currentStep] = {
    chatHTML: chatEl.innerHTML,
    ctxHTML: ctxEl.innerHTML,
    msg: currentBars.msg,
    obs: currentBars.obs,
    total: currentBars.total,
    callout: $('#callout').innerHTML,
    panelClass: $('#context-panel').className,
    shimmerClass: shimmer.className,
    ctxMessages: JSON.parse(JSON.stringify(contextMessages)),
  };
}

function restoreSnapshot(n) {
  const s = snapshots[n];
  if (!s) return;
  chatEl.innerHTML = s.chatHTML;
  ctxEl.innerHTML = s.ctxHTML;
  setBars(s.msg, s.obs, s.total);
  $('#callout').innerHTML = s.callout;
  $('#context-panel').className = s.panelClass || '';
  shimmer.className = s.shimmerClass || '';
  currentBars = { msg: s.msg, obs: s.obs, total: s.total };
  contextMessages = JSON.parse(JSON.stringify(s.ctxMessages || []));
  if (viewMode === 'json') renderJSON();
}

let currentBars = { msg: 0, obs: 0, total: 0 };
function updateBars(msg, obs) {
  const total = msg + obs;
  currentBars = { msg, obs, total };
  setBars(msg, obs, total);
}

// ── Navigation ────────────────────────────────────────────
let animating = false;

async function goToStep(n) {
  if (n < 0 || n > LAST_STEP || animating) return;
  animating = true;
  nextBtn.disabled = true;

  // Going backward
  if (n < currentStep) {
    currentStep = n;
    restoreSnapshot(n);
    updateUI();
    animating = false;
    return;
  }

  // Going forward: save current snapshot before advancing
  saveSnapshot();
  currentStep = n;
  lastChatRole = null;
  stepFirstUserPlayed = false;
  await stepFns[n]();
  if (lastChatRole === 'user') playSend();
  else if (lastChatRole === 'assistant') playReceive();
  saveSnapshot();
  updateUI();
  animating = false;
}

// Preview text for each step: what the user is "about to send"
const inputPreviews = {
  0: "Hey, can you help me plan a trip to Tokyo?",
  1: "Whoa, that's a lot. Can you keep responses short and to the point?",
  2: "Next week, 5 days, ~$3K budget, flying from SFO.",
  3: "Great! Can you find flights and hotels?",
  7: "What are some must-try restaurants near Shibuya?",
  8: "Can you check flights again? Prices might have changed.",
};

const sendBtn = $('#btn-send');
const inputPreview = $('#input-preview');
const nextBtn = $('#btn-next');

// Label describes what the NEXT click will do
const nextLabels = {
  0: 'Start',
  1: 'Send reply',
  2: 'Send details',
  3: 'Search flights and hotels',
  4: 'Keep chatting',
  5: 'Run Observer',
  6: 'Keep chatting',
  7: 'Run Observer',
  8: 'Re-check flights',
  9: 'Fast-forward',
  10: 'Run Reflector',
  11: 'Wrap up',
  12: 'Summary',
};

function updateUI() {
  const done = currentStep >= LAST_STEP;
  sendBtn.disabled = true;
  nextBtn.disabled = done;
  nextBtn.textContent = nextLabels[currentStep] || 'Next';

  // Update input preview and button style
  const preview = inputPreviews[currentStep] || '';
  inputPreview.textContent = preview;
  if (preview) {
    sendBtn.classList.remove('alt');
    sendBtn.textContent = 'Send';
  } else {
    sendBtn.classList.add('alt');
    sendBtn.textContent = 'Next';
  }
}

$('#btn-next').addEventListener('click', () => goToStep(currentStep + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goToStep(currentStep + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goToStep(currentStep - 1); }
});

// ── Init ──────────────────────────────────────────────────
updateBars(0, 0);
updateUI();
